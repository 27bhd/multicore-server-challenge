spring.application.name=conduit

# SPEC rule 4/5: HOST/PORT from the environment (Spring resolves ${VAR:default} from the process env).
server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}

# SPEC rule 2: Tomcat runs every request on its own virtual thread (no 200-thread platform pool).
spring.threads.virtual.enabled=true

# SPEC rule 7: idle keep-alive outlives Nginx's (Tomcat's default is its 20 s connectionTimeout).
server.tomcat.keep-alive-timeout=65s
# Don't let default caps be the limit: Tomcat's defaults are 8192 connections, a 100-deep accept
# queue and a close after every 100 requests on a keep-alive connection (Go and Nginx have no such cap).
server.tomcat.max-connections=20000
server.tomcat.accept-count=1024
server.tomcat.max-keep-alive-requests=-1

# HikariCP: maximumPoolSize = DB_POOL_SIZE (10 x cores), 5 s to get a connection.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

# Unknown paths become NoHandlerFoundException (404 in the SPEC error shape), not a static-resource lookup.
spring.web.resources.add-mappings=false

# Bodies are JSON whatever the Content-Type: don't let FormContentFilter consume a PUT/DELETE body
# sent as application/x-www-form-urlencoded.
spring.mvc.formcontent.filter.enabled=false
