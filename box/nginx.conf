# /etc/nginx/nginx.conf on the benchmark box (Nginx 1.30.x from nginx.org). Installed by setup-box.sh.
#
# Only connection limits differ from the nginx.org package default:
#   worker_rlimit_nofile  file descriptors per worker (each client connection is one, each upstream one more)
#   worker_connections    simultaneous connections per worker (package default: 1024)
# Every "active user" in the load generator holds a keep-alive connection, so tens of thousands of mostly idle
# connections are normal here.
user nginx;
worker_processes auto;              # one worker per core
worker_rlimit_nofile 200000;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 65535;
    # multi_accept: default (off)
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # Client keep-alive: a virtual user keeps its connection open between page views (think time ~7 s).
    keepalive_timeout 65s;
    keepalive_requests 100000;

    access_log off;   # the site turns on its own buffered log
    include /etc/nginx/conf.d/*.conf;
}
