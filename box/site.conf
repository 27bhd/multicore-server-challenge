# /etc/nginx/conf.d/challenge.conf: plain reverse proxy to your server on 127.0.0.1:3000 (if you chose Nginx).
# Installed by setup-box.sh (the package's conf.d/default.conf is removed). Not yours to change.

upstream conduit_app {
    server 127.0.0.1:3000;
    keepalive 256;                  # idle upstream connections cached per worker
    keepalive_requests 100000;
    keepalive_timeout 60s;          # keep your idle connections open >= 65 s, so Nginx always closes first
}

# Buffered access log: one write per 64 KB or every 5 s.
log_format conduit '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/conduit.access.log conduit buffer=64k flush=5s;
    error_log  /var/log/nginx/conduit.error.log warn;

    gzip on;
    gzip_types application/json;    # text/html is always included
    gzip_min_length 1024;           # gzip_comp_level: default 1

    location / {
        proxy_pass http://conduit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # required for upstream keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
